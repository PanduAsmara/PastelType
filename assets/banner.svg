<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181926" />
      <stop offset="50%" stop-color="#201f30" />
      <stop offset="100%" stop-color="#141520" />
    </linearGradient>

    <!-- Pastel Mesh Glows -->
    <radialGradient id="pinkGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#e27396" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#e27396" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#8675e6" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#8675e6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="mintGlow" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#5c8760" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#5c8760" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fed7e2" />
      <stop offset="75%" stop-color="#e27396" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>

    <!-- Keycap Gradient -->
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3042" />
      <stop offset="100%" stop-color="#202230" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#e27396" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Canvas with Rounded Corners -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <rect width="1200" height="420" rx="24" fill="url(#pinkGlow)" />
  <rect width="1200" height="420" rx="24" fill="url(#purpleGlow)" />
  <rect width="1200" height="420" rx="24" fill="url(#mintGlow)" />

  <!-- Subtle Grid Accent -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="500" y1="0" x2="500" y2="420" />
    <line x1="700" y1="0" x2="700" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- FLOATING ELEMENT: Left Stats Card -->
  <g transform="translate(60, 85)" filter="url(#softShadow)">
    <rect width="210" height="110" rx="18" fill="#232534" fill-opacity="0.82" stroke="#35394d" stroke-width="1.5" />
    <text x="24" y="38" fill="#9da7c0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">LIVE SPEED</text>
    <text x="24" y="80" fill="#e27396" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="38" font-weight="800">128</text>
    <text x="110" y="80" fill="#9da7c0" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600">WPM</text>
    <circle cx="175" cy="45" r="5" fill="#5c8760" />
    <circle cx="175" cy="45" r="9" fill="#5c8760" fill-opacity="0.3" />
  </g>

  <!-- FLOATING ELEMENT: Left Bottom Accuracy Card -->
  <g transform="translate(85, 225)" filter="url(#softShadow)">
    <rect width="185" height="90" rx="18" fill="#232534" fill-opacity="0.82" stroke="#35394d" stroke-width="1.5" />
    <text x="22" y="34" fill="#9da7c0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ACCURACY</text>
    <text x="22" y="70" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="800">99.4%</text>
    <rect x="130" y="48" width="36" height="20" rx="6" fill="#8675e6" fill-opacity="0.25" />
    <text x="148" y="62" fill="#c4b5fd" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PB</text>
  </g>

  <!-- FLOATING ELEMENT: Right Floating Keycaps -->
  <g transform="translate(930, 95)" filter="url(#softShadow)">
    <!-- Keycap T -->
    <g transform="translate(0, 0)">
      <rect width="65" height="65" rx="14" fill="#2a2c3d" stroke="#41455e" stroke-width="1.5" />
      <rect x="5" y="4" width="55" height="52" rx="10" fill="url(#keyGrad)" />
      <text x="32" y="38" fill="#fed7e2" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" text-anchor="middle">T</text>
    </g>

    <!-- Keycap Y -->
    <g transform="translate(80, 20)">
      <rect width="65" height="65" rx="14" fill="#2a2c3d" stroke="#e27396" stroke-width="1.8" filter="url(#glowShadow)" />
      <rect x="5" y="4" width="55" height="52" rx="10" fill="#322635" />
      <text x="32" y="38" fill="#e27396" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="800" text-anchor="middle">Y</text>
    </g>

    <!-- Keycap P -->
    <g transform="translate(30, 95)">
      <rect width="65" height="65" rx="14" fill="#2a2c3d" stroke="#41455e" stroke-width="1.5" />
      <rect x="5" y="4" width="55" height="52" rx="10" fill="url(#keyGrad)" />
      <text x="32" y="38" fill="#fed7e2" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" text-anchor="middle">P</text>
    </g>

    <!-- Keycap E -->
    <g transform="translate(110, 115)">
      <rect width="65" height="65" rx="14" fill="#2a2c3d" stroke="#8675e6" stroke-width="1.5" />
      <rect x="5" y="4" width="55" height="52" rx="10" fill="#29283f" />
      <text x="32" y="38" fill="#c4b5fd" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="700" text-anchor="middle">E</text>
    </g>

    <!-- Sound Badge -->
    <g transform="translate(15, 195)">
      <rect width="165" height="42" rx="21" fill="#232534" stroke="#35394d" stroke-width="1.2" />
      <text x="24" y="26" font-size="14">🔊</text>
      <text x="48" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Thock Switch</text>
    </g>
  </g>

  <!-- CENTER HERO CONTENT -->
  <g transform="translate(600, 140)" text-anchor="middle">
    <!-- Top Pill Badge -->
    <g transform="translate(0, -50)">
      <rect x="-115" y="-16" width="230" height="32" rx="16" fill="#e27396" fill-opacity="0.18" stroke="#e27396" stroke-opacity="0.4" stroke-width="1.2" />
      <text x="0" y="5" fill="#fbb6ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">🌸 MONKEYTYPE-INSPIRED</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="45" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="68" font-weight="900" letter-spacing="-2">PastelType</text>

    <!-- Subtitle -->
    <text x="0" y="95" fill="#c4c9d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
      Aesthetic &amp; Elegant Typing Speed Test with Pastel Accents
    </text>

    <!-- Feature Tag Pills -->
    <g transform="translate(0, 145)">
      <!-- Pill 1: 6 Themes -->
      <g transform="translate(-240, 0)">
        <rect x="-60" y="-15" width="120" height="30" rx="15" fill="#27293a" stroke="#3e435c" stroke-width="1" />
        <circle cx="-38" cy="0" r="5" fill="#e27396" />
        <circle cx="-26" cy="0" r="5" fill="#8675e6" />
        <circle cx="-14" cy="0" r="5" fill="#5c8760" />
        <text x="14" y="4" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">6 Tema</text>
      </g>

      <!-- Pill 2: Audio Synthesizer -->
      <g transform="translate(-90, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#27293a" stroke="#3e435c" stroke-width="1" />
        <text x="0" y="4" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">🎧 Mechanical Audio</text>
      </g>

      <!-- Pill 3: SVG Chart -->
      <g transform="translate(65, 0)">
        <rect x="-60" y="-15" width="120" height="30" rx="15" fill="#27293a" stroke="#3e435c" stroke-width="1" />
        <text x="0" y="4" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">📊 SVG Graph</text>
      </g>

      <!-- Pill 4: Zero Dependencies -->
      <g transform="translate(210, 0)">
        <rect x="-60" y="-15" width="120" height="30" rx="15" fill="#27293a" stroke="#3e435c" stroke-width="1" />
        <text x="0" y="4" fill="#f6ad55" font-family="sans-serif" font-size="11" font-weight="700">⚡ Zero Config</text>
      </g>
    </g>
  </g>

  <!-- Subtle Floating Sakura Petals -->
  <g fill="#e27396" opacity="0.45">
    <ellipse cx="340" cy="70" rx="9" ry="5" transform="rotate(35, 340, 70)" />
    <ellipse cx="840" cy="80" rx="8" ry="4" transform="rotate(-25, 840, 80)" />
    <ellipse cx="380" cy="350" rx="10" ry="5" transform="rotate(15, 380, 350)" />
    <ellipse cx="780" cy="340" rx="7" ry="4" transform="rotate(-40, 780, 340)" />
    <ellipse cx="1140" cy="320" rx="9" ry="5" transform="rotate(20, 1140, 320)" />
    <ellipse cx="60" cy="370" rx="8" ry="4" transform="rotate(-15, 60, 370)" />
  </g>
</svg>
